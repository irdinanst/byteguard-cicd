name: 3 - Deploy Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Package File
        run: |
          echo '{
            "name": "byteguard",
            "version": "1.0.0",
            "description": "ByteGuard Cyber Threat Detection System",
            "scripts": {
              "test": "echo All tests passed successfully"
            }
          }' > package.json

      - name: Install Dependencies
        run: npm install --package-lock-only

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Build Project
        run: |
          echo "Building ByteGuard..."
          mkdir -p dist
          cp index.html dist/
          cp style.css dist/
          echo "Build Version: 1.0.0" > dist/build-info.txt
          echo "Deploy Date: $(date)" >> dist/build-info.txt
          echo "Build complete!"

      - name: Deploy to Netlify
        run: |
          netlify deploy --prod --dir=dist --message="ByteGuard v1.0.0 Production Deploy"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deployment Success
        run: |
          echo "ByteGuard successfully deployed!"
          echo "Live URL: https://peppy-kelpie-065e30.netlify.app"
          echo "Deploy completed at: $(date)"
